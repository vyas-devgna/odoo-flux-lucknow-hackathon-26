{% if user.is_authenticated and user.role == 'customer' %}<div class="field"><label for="signed">Type your full name to accept</label><input class="input" id="signed" name="signed_name" value="{{ user.name }}" required></div>
<div class="field check" style="margin:12px 0"><input type="checkbox" name="agree" id="agree" required><label for="agree">I accept this order and the billing terms: {{ plan.get_payment_terms_display }}, {{ plan.get_cancel_policy_display|lower }}.</label></div><button id="subscribe-button" class="btn primary block" {% if selection_error %}disabled aria-describedby="selection-error"{% endif %}>Subscribe</button>
{% elif user.is_authenticated %}<div class="callout warn">You're signed in as {{ user.get_role_display|lower }}. Create quotations for customers from Sales.</div>
{% else %}<a class="btn primary block" href="{% url 'accounts:signup' %}?next={{ request.path }}">Create an account to subscribe</a><p class="small mute" style="margin-top:8px;text-align:center">Already have one? <a class="fine" href="{% url 'accounts:login' %}?next={{ request.path }}" style="text-decoration:underline">Sign in</a></p>{% endif %}
