{% load ui %}<form class="filters" method="get" hx-boost="true" id="rf">
<input class="input" type="date" name="from" value="{{ from_ }}" aria-label="From"><input class="input" type="date" name="to" value="{{ to }}" aria-label="To">
<select class="input" name="plan" onchange="this.form.requestSubmit()" aria-label="Plan"><option value="">All plans</option>{% for p in plans %}<option value="{{ p.pk }}" {% if f.plan == p.pk|stringformat:'s' %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select>
<select class="input" name="product" onchange="this.form.requestSubmit()" aria-label="Product"><option value="">All products</option>{% for p in products %}<option value="{{ p.pk }}" {% if f.product == p.pk|stringformat:'s' %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select>
<select class="input" name="salesperson" onchange="this.form.requestSubmit()" aria-label="Salesperson"><option value="">Anyone</option>{% for u in salespeople %}<option value="{{ u.pk }}" {% if f.salesperson == u.pk|stringformat:'s' %}selected{% endif %}>{{ u.name|default:u.email }}</option>{% endfor %}</select>
<select class="input" name="customer" onchange="this.form.requestSubmit()" aria-label="Customer"><option value="">All customers</option>{% for c in customers %}<option value="{{ c.pk }}" {% if f.customer == c.pk|stringformat:'s' %}selected{% endif %}>{{ c.display_name|truncatechars:30 }}</option>{% endfor %}</select>
<button class="btn sm">Apply</button>{% if f.any %}<a class="btn sm ghost" href="?">Reset</a>{% endif %}<span style="margin-left:auto" class="btns"><a class="chip-btn" hx-boost="false" href="?{% qs export='csv' %}">{% icon 'download' %}CSV</a><button type="button" class="chip-btn" onclick="print()">{% icon 'print' %}Print</button></span></form>
