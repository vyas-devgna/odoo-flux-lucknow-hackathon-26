{% load ui %}{% if page.paginator.count %}<div class="pager"><span>{{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</span>
<div class="btns">{% if page.has_previous %}<a class="btn sm" href="?{% qs page=page.previous_page_number %}">Previous</a>{% endif %}{% if page.has_next %}<a class="btn sm" href="?{% qs page=page.next_page_number %}">Next</a>{% endif %}</div></div>{% endif %}
