{% load ui %}{% if strip %}<div class="strip card" role="group" aria-label="Summary">{% for c in strip %}<{% if c.href %}a href="{{ c.href }}"{% else %}div{% endif %} class="cell{% if c.tone %} {{ c.tone }}{% endif %}"><small>{{ c.label }}</small><b class="num">{{ c.value }}</b>{% if c.sub %}<em>{{ c.sub }}</em>{% endif %}</{% if c.href %}a{% else %}div{% endif %}>{% endfor %}</div>{% endif %}
